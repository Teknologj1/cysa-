<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Você está offline — CySA+ Prep</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #070b12;
      color: #e6edf5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 460px; width: 100%; background: #0e1521; border: 1px solid #1c2634; border-radius: 16px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 0 0 10px; color: #94a3b8; font-size: 14px; line-height: 1.6; }
    a { color: #22d3ee; }
    .links { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    .links a { display: inline-block; padding: 10px 16px; border: 1px solid #1c2634; border-radius: 10px; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Você está offline</h1>
      <p>Esta página ainda não foi baixada para o seu aparelho. As telas que você já visitou continuam disponíveis, e o seu progresso está salvo aqui mesmo.</p>
      <p>Assim que a conexão voltar, tudo volta ao normal automaticamente.</p>
      <div class="links">
        <a href="/">Início</a>
        <a href="/curso">Curso</a>
        <a href="/simulado">Simulado</a>
      </div>
    </div>
  </div>
</body>
</html>
